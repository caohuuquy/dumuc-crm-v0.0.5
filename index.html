<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        try {
          var currentFetch = window.fetch;

          function defineAccessor(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            defineAccessor(Window.prototype);
          }

          var curr = window;
          while (curr) {
            var desc = Object.getOwnPropertyDescriptor(curr, 'fetch');
            if (desc && (!desc.writable || !desc.set)) {
              defineAccessor(curr);
            }
            curr = Object.getPrototypeOf(curr);
          }

          defineAccessor(window);

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineAccessor(globalThis);
          }
        } catch (e) {
          console.warn('Fetch setter initialization warning:', e);
        }
      })();
    </script>
    <title>Sàn - v3.6</title>
